[package]
name = "elf-cli"
# semver 매핑: elf-cli/VERSION "v2.4.1" ↔ "2.4.1" (표시 버전 SSOT = VERSION, 규칙 = Versioning_Policy)
version = "2.6.0"
edition = "2024"
description = "ELF (Eli's Lab Framework) scaffold & update CLI"
repository = "https://github.com/ProjectEli/ELF"

[[bin]]
name = "elf"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# self-update (t06 stage 3) — 라이브러리 모드 (별도 updater 바이너리는 UAC update-키워드 함정, S007 t04)
axoupdater = { version = "0.9", default-features = false, features = ["github_releases", "blocking"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
